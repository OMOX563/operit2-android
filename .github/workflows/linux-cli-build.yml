name: Linux CLI Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Operit2 upstream ref to build (tag, branch or commit)"
        required: false
        default: "main"
        type: string
      cli_arches:
        description: "Linux CLI architectures (host = native glibc build)"
        required: false
        default: "host"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

env:
  UPSTREAM_REPO: AAswordman/Operit2

jobs:
  build-linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout upstream Operit2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref }}
          path: operit2-src

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # host 模式只需要常规构建工具；musl / aarch64 交叉工具链在改成
          # host 构建后不再需要（见下方 Build 步骤的说明）。
          sudo apt-get install -y \
            clang \
            cmake \
            g++ \
            ninja-build \
            pkg-config \
            libssl-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # tools/build_scripts/check_build_environment.py 的 check_common_tools()
      # 无条件检查 fvm / dart 是否在 PATH 上（不按 --products 过滤），即使只构建
      # CLI 也一样。CLI 本身不需要 Flutter，但这个门禁过不去就不能往下走。
      # 只装 fvm CLI + Dart SDK 即可（检查项是 `fvm --version` / `dart --version`），
      # 不需要 `fvm install` 拉整个 Flutter SDK。
      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # build_cli_linux.py → build_cli_target() → prepare_plugin_assets() 会跑
      # plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload，
      # 该脚本需要：
      #   1. 仓库管理的 TS 编译器（.ci-tools/typescript/node_modules/.bin/tsc，
      #      仓库里没有这个目录，CI 时现装；脚本不 fallback 到 PATH 的 tsc）
      #   2. corepack pnpm（脚本用 `corepack pnpm install --frozen-lockfile`，
      #      而自打包型包的 pack:toolpkg 内部又调裸 `pnpm run pack:toolpkg`）
      #   3. plugins/packages/buildin/workflow 的依赖（character_cards /
      #      workflow 的 build.mjs 经 workflow/package.json 解析
      #      esbuild / fflate / typescript）
      # 上游的 linux-release-build.yml 只装了 Node.js，没有这三样 → 会失败。
      - name: Install repository-managed TypeScript compiler
        working-directory: operit2-src
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          .ci-tools/typescript/node_modules/.bin/tsc --version

      - name: Enable corepack pnpm shim
        run: |
          corepack enable pnpm
          pnpm --version

      - name: Install built-in workflow plugin dependencies
        working-directory: operit2-src/plugins/packages/buildin/workflow
        run: |
          corepack pnpm install --frozen-lockfile
          for m in esbuild fflate typescript; do
            test -d "node_modules/$m" || { echo "missing $m" >&2; exit 1; }
          done

      # build_cli_linux.py 用 REPO_ROOT/.venv/bin/python 跑同步脚本，
      # prepare_python_command() 会在 Linux 上把 .venv/bin/python 软链到当前
      # python。这里先建好 venv，路径与 Gradle 里硬编码的 .venv/bin/python 一致。
      - name: Create repository Python virtual environment
        working-directory: operit2-src
        run: |
          python3 -m venv .venv
          test -x .venv/bin/python || { echo ".venv/bin/python missing" >&2; exit 1; }
          .venv/bin/python --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu

      - name: Check build environment
        working-directory: operit2-src
        run: python3 tools/build_scripts/check_build_environment.py --products cli --cli-arches "${{ inputs.cli_arches }}" --github-runner

      # 产出 tools/release/dist/operit2-cli-linux-*.tar.gz。
      # 脚本内部自带 prepare_plugin_assets()（cargo build 之前同步插件）与
      # verify_cli_plugin_assets()（校验二进制确实嵌入了所有 .toolpkg）。
      #
      # ★ 用 --arches host 而不是 all（2026-11-06 修）：
      # CLI_RUST_TARGETS 把 linux/x86_64 硬编码成 x86_64-unknown-linux-musl，
      # 而 local-model crate 的默认 feature native-llm 会用 CMake 编 C++。
      # Ubuntu 的 musl-tools 只提供 musl-gcc，**没有 musl-g++**，于是 CMake 报：
      #   The CMAKE_CXX_COMPILER: /usr/bin/musl-g++ is not a full path to an
      #   existing compiler tool
      #   thread 'main' panicked at cmake-0.1.58/src/lib.rs:1132
      # host 模式走 use_default_target=True → 不加 --target → 原生 glibc 编译，
      # 完全不需要 musl 工具链；而 runner 与目标机都是 Ubuntu 24.04 /
      # glibc 2.39，二进制可直接运行。
      # 同理 aarch64 也踩这个坑：gcc-aarch64-linux-gnu 同样不含 g++。
      # --cli-arches host 还会让 check_build_environment 跳过全部 cross 检查
      # （check_linux_cross_cli 对 host 直接返回空）。
      - name: Build and package Linux CLI
        working-directory: operit2-src
        run: python3 tools/build_scripts/build_cli_linux.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Linux CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-linux-cli-${{ github.sha }}
          path: operit2-src/tools/release/dist/operit2-cli-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 14
