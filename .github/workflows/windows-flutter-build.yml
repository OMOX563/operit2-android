name: Windows Flutter Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Operit2 upstream ref to build (tag, branch or commit)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

env:
  UPSTREAM_REPO: AAswordman/Operit2

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout upstream Operit2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref }}
          path: operit2-src

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: operit2-src/apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      # --- 上游 windows workflow 漏掉的前置步骤（main 从未构建成功）---
      # windows/runner/CMakeLists.txt 硬编码 .venv/Scripts/python.exe 跑
      # sync_operit_plugins，runner 从不创建它 → MSB8066。
      - name: Create repository Python virtual environment
        working-directory: operit2-src
        shell: pwsh
        run: |
          python -m venv .venv
          if (!(Test-Path .venv/Scripts/python.exe)) { throw ".venv/Scripts/python.exe missing" }

      # ★ 以下四步的顺序是硬约束（2026-11-06 修），不能重排：
      #
      # cargo check 会编译 core/crates/runtime/application，其 build.rs 调用
      # collect_example_packages()，要求 plugins/packages/buildin 下每个带
      # manifest 的包都能在 assets/plugins/buildin 里找到同名 {name}.toolpkg
      # 归档，缺一个就直接 panic：
      #   panicked at crates\runtime\application\build.rs:599:32:
      #   package example has no embedded archive: ...\change_review
      #
      # 上游 2026-11-06 起 change_review 改成「自打包型」——归档由它的
      # scripts/build.mjs 产出（目录型包则由 build.rs 自己打包）。自打包的
      # 归档只能靠同步脚本生成，所以 cargo check 之前必须先把同步跑完；
      # 而同步脚本需要 TS 编译器 + corepack pnpm + workflow 依赖。
      # 原来 cargo check 排在依赖安装之前 → 顺序倒置 → 必失败。
      # （Android workflow 没这个坑：那边同步由 Gradle 钩子 :app:syncOperitPlugins
      #   触发，天然在依赖安装之后。）
      #
      # 插件同步脚本用仓库管理的 TS 编译器（.ci-tools/typescript），不 fallback PATH。
      - name: Install repository-managed TypeScript compiler
        working-directory: operit2-src
        shell: pwsh
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          .ci-tools/typescript/node_modules/.bin/tsc.cmd --version

      # sync 脚本调 corepack pnpm，但 pack:toolpkg 内部又调裸 pnpm。
      - name: Enable corepack pnpm shim
        shell: pwsh
        run: |
          corepack enable pnpm
          pnpm --version

      # character_cards build.mjs 经 workflow/package.json 解析 esbuild/fflate/typescript。
      - name: Install built-in workflow plugin dependencies
        working-directory: operit2-src/plugins/packages/buildin/workflow
        shell: pwsh
        run: |
          corepack pnpm install --frozen-lockfile
          foreach ($m in @("esbuild","fflate","typescript")) {
            if (!(Test-Path "node_modules/$m")) { throw "missing $m" }
          }

      # 产出 assets/plugins/buildin 下的 {name}.toolpkg 归档（自打包型包只能
      # 靠这一步产生）。--no-hot-reload：CI 里没有正在跑的 Flutter VM。
      #
      # 三个自打包型包（scripts 里定义了 pack:toolpkg）的归档由 JS 产出：
      #   change_review / character_cards / workflow
      # 目录型包（daily_life / goal_mode / plan_mode / message_translation）
      # 由 build.rs 自己打包，不依赖这一步。
      - name: Sync builtin and external plugin packages
        working-directory: operit2-src
        shell: pwsh
        run: |
          # --source runtime = buildin + external。external 也必须同步：build.rs
          # 的 collect_example_packages() 会遍历 plugins/packages/external，缺归档
          # 同样 panic（package example has no embedded archive: ...\external\context_limiter）。
          python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload
          foreach ($collection in @("buildin","external")) {
            $assets = "core/crates/runtime/application/assets/plugins/$collection"
            if (!(Test-Path $assets)) { throw "missing $assets" }
            Get-ChildItem $assets -Filter *.toolpkg | ForEach-Object { Write-Host "asset[$collection]: $($_.Name) $($_.Length)" }
          }
          # 自打包型包缺归档时，build.rs 的 collect_example_packages() 会直接
          # panic（package example has no embedded archive）。这里提前失败并
          # 指名道姓，比让它在 cargo check 里炸清楚得多。
          $selfPacked = @{
            "buildin"  = @("change_review","character_cards","workflow")
            "external" = @("openui")
          }
          foreach ($collection in $selfPacked.Keys) {
            $assets = "core/crates/runtime/application/assets/plugins/$collection"
            foreach ($pkg in $selfPacked[$collection]) {
              $archive = "$assets/$pkg.toolpkg"
              if (!(Test-Path $archive)) { throw "missing self-packed archive: $archive" }
              Write-Host "self-packed ok: $collection/$pkg"
            }
          }

      # build_flutter_windows.py 不调 generate_dart_proxy_artifacts()（android/
      # ios/macos 脚本都调），.g.dart 是 gitignored 生成物 → Dart 编译报
      # 'RuntimeDeviceSpaceDevice' isn't a type。cargo check 会生成它们。
      - name: Generate Dart proxy artifacts
        working-directory: operit2-src
        shell: pwsh
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          foreach ($f in @(
            "apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart",
            "apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart"
          )) { if (!(Test-Path $f)) { throw "missing generated proxy artifact: $f" } }

      - name: Build and package Windows app
        working-directory: operit2-src
        shell: pwsh
        run: python tools/build_scripts/build_flutter_windows.py --enforce-lockfile

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: operit2-src/tools/release/dist/operit2-app-windows-x86_64-*.zip
          if-no-files-found: error
          retention-days: 14
